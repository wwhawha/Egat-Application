function receiverTracking(){
 const j=s.job, stage=receiverStage(),risk=riskDetails();
 const steps=[['เตรียมสินค้า',j.weighted],['ออกจากแม่เมาะ',j.trackingStarted],['ผ่านจุดตรวจ In / Out',j.checkpointIn&&j.checkpointOut],['ถึงจุดส่งสินค้า',j.arrived],['ตรวจรับสำเร็จ',j.receiverVerified]];
 const last=s.lastGPSAt?new Date(s.lastGPSAt).toLocaleString('th-TH',{dateStyle:'short',timeStyle:'short'}):'ยังไม่ได้รับข้อมูล';
 const shouldWarn=j.trackingStarted&&!j.arrived&&(j.internet===false||j.gps===false||risk.level!=='ปกติ');
 return `<div class="receiverTrackingView"><div class="trackingTitle"><h2>ติดตามสินค้า</h2><span class="badge ${j.arrived?'green':'warn'}">${j.arrived?'ถึงปลายทางแล้ว':j.trackingStarted?'กำลังขนส่ง':'เตรียมสินค้า'}</span></div>
 ${card(`<div class="sub">สินค้า</div><h2>${esc(j.material)}</h2>${row('หมายเลขงาน',esc(j.id))}${row('ลูกค้า / ผู้ซื้อ',esc(j.customerName||'ยังไม่ผูกข้อมูลลูกค้า'))}${row('รหัสลูกค้า',esc(j.customerCode||'—'))}${row('ทะเบียนรถ',esc(j.plate))}${row('ปลายทาง',esc(j.destination))}`)}
 ${card(`<div class="receiverStatusText">${esc(stage.title)}</div><div class="sub">${esc(stage.hint)}</div>${j.dispatchAt?`<div class="receiverETA"><span>กรอบเวลาส่งมอบตามแผน</span><b>${deadline()}</b></div>`:'<div class="sub">แสดงกรอบเวลาส่งมอบเมื่อรถออกเดินทาง</div>'}`)}

 ${card(`<h3>การส่งมอบ</h3>${row('สแกน Delivery QR',j.receiverScanned?'ยืนยันแล้ว':'รอสแกน')}${row('ใบชั่งปลายทาง',j.weightPhoto?'ได้รับหลักฐานแล้ว':'รอหลักฐาน')}${row('ผลยืนยันผู้รับ',j.receiverVerified?'ยืนยันแล้ว':'ยังไม่ยืนยัน')}${j.reviewRequired?'<div class="notice warn">EGAT ขอภาพหลักฐานเพิ่มเติมจากคนขับ</div>':''}${btn('กลับหน้าหลัก','goHome','light')}`)}
 </div>`;
}

 else if(j.weighted && !j.qrIssued) step={title:'ออก QR รับงานให้คนขับ',desc:'สร้าง QR สำหรับให้คนขับสแกนรับงานและเริ่มการขนส่ง',label:'ออก QR รับงาน',action:'qr',className:'green'};
 else if(j.qrIssued) step={title:'ดำเนินการต้นทางครบแล้ว',desc:'ขณะนี้คนขับสามารถรับงานในแอปและเริ่มเดินทางได้ ขั้นตอนถัดไปอยู่ที่หน้าติดตามการขนส่ง',label:'ไปหน้าติดตามการขนส่ง',action:'to-tracking',className:'secondary'};

 const canvas=document.createElement('canvas');
 const w=720,h=960;canvas.width=w;canvas.height=h;const ctx=canvas.getContext('2d');
 const now=new Date();
 const timestamp=now.toLocaleString('th-TH',{dateStyle:'medium',timeStyle:'medium'});

 ctx.fillStyle='#dbe8f7';ctx.fillRect(0,0,w,h);
 const g=ctx.createLinearGradient(0,0,0,h);g.addColorStop(0,'#0d2a45');g.addColorStop(1,'#173d63');ctx.fillStyle=g;ctx.fillRect(36,36,w-72,h-72);
 ctx.fillStyle='#f4f7fb';ctx.fillRect(68,118,w-136,h-300);
 ctx.strokeStyle='#b7c7da';ctx.lineWidth=3;ctx.strokeRect(68,118,w-136,h-300);
 ctx.fillStyle='#365c87';ctx.fillRect(68,118,w-136,46);
 ctx.fillStyle='#ffffff';ctx.font='700 24px Arial';ctx.fillText(subtitle,92,148);
 if(mode==='weight'){
   ctx.fillStyle='#ffffff';ctx.fillRect(112,214,496,280);ctx.strokeStyle='#37557b';ctx.lineWidth=2;ctx.strokeRect(112,214,496,280);
   ctx.fillStyle='#173d63';ctx.font='700 28px Arial';ctx.fillText('WEIGHT TICKET',248,254);
   ctx.font='500 24px Arial';ctx.fillText('Origin Net: '+Number(s.job.net||25.50).toFixed(2)+' t',142,314);ctx.fillText('Destination Net: '+Number(s.job.ticketNet??25.55).toFixed(2)+' t',142,354);ctx.fillText('Vehicle: '+s.job.plate,142,394);ctx.fillText('Driver: '+s.job.driver,142,434);ctx.fillText('Receiver: '+(s.receiverFullName||'ผู้รับสินค้า'),142,474);
 } else {
   ctx.fillStyle='#c8d8ea';ctx.fillRect(118,246,484,178);ctx.fillStyle='#8ea9c6';ctx.fillRect(162,210,396,42);ctx.fillStyle='#173d63';ctx.fillRect(138,388,444,72);
   ctx.fillStyle='#ffffff';ctx.font='700 24px Arial';ctx.fillText('EMPTY TRUCK EVIDENCE',208,432);
 }
 ctx.fillStyle='#0c2541';ctx.fillRect(68,646,w-136,226);
 ctx.fillStyle='#f9c748';ctx.fillRect(68,646,w-136,6);
 ctx.fillStyle='#ffffff';ctx.font='700 24px Arial';ctx.fillText('EGAT LOGISTICS  /  TIMESTAMP DEMO',90,689);
 ctx.font='600 22px Arial';ctx.fillText(title,90,727);
 ctx.font='500 18px Arial';
 const lines=[
   `Date & time: ${timestamp}`,
   `Job: ${s.job.id}`,
   `Vehicle: ${s.job.plate}`,
   `Distance: ${distance} m  /  Geofence: 500 m`,
   `Demo GPS: ${coords}`
 ];
 lines.forEach((line,i)=>ctx.fillText(line,90,758+i*23));
 const round=s.job.reviewRequired?Math.max(1,Number(s.job.reviewRound||1)):Math.max(1,Number(s.job.evidenceRound||1));
 const evidenceId='EVD-'+s.job.id.split('-').pop()+'-R'+String(round).padStart(2,'0')+'-'+(mode==='weight'?'WT':'ET')+'-'+String((s.job.evidenceRecords||[]).length+1).padStart(2,'0');
 return {data:canvas.toDataURL('image/jpeg',0.78),at:now.toISOString(),distance,coords,round,evidenceId,kind:mode,ticketNet:mode==='weight'?Number(s.job.ticketNet??25.55):null};
}

// V34: e-POD is checked against the server's shared receiver acknowledgment.
// It does NOT depend on the receiver's login session existing in the driver's browser.
async function submitEpodFromSharedJob(){
 if(LAN_ROLE!=='driver'){
   alert('การส่ง e-POD ข้ามเครื่องต้องเปิดลิงก์ /driver โดยตรง (ไม่ใช่หน้าแอปตัวอย่างใน /staff)');
   return;
 }
 const buttons=[...document.querySelectorAll('button')].filter(b=>b.textContent.includes('ส่งหลักฐาน e-POD'));
 for(const b of buttons)b.disabled=true;
 try{
   // Fetch the authoritative state just before submitting, eliminating stale local checks.
   const response=await fetch('/api/state',{cache:'no-store'});
   if(!response.ok)throw new Error('ไม่สามารถโหลดสถานะล่าสุดจากเซิร์ฟเวอร์');
   const snapshot=await response.json();
   if(Number(snapshot.resetEpoch)!==Number(lanObservedResetEpoch)){
      await lanPoll();throw new Error('ระบบเพิ่งรีเซ็ต กรุณาโหลดหน้าใหม่แล้วทำรายการอีกครั้ง');
   }
   const server=snapshot.job||{};
   const missing=[];
   if(!server.arrived)missing.push('รถยังไม่ถึงปลายทาง');
   if(!server.receiverScanned)missing.push('ผู้รับยังไม่ได้สแกน Delivery QR');
   if(!server.receiverIdentityChecked||!server.deliveryReceiverId||server.deliveryReceiverId!==(server.assignedReceiverId||'RCV-0001'))missing.push('การยืนยันสิทธิ์ผู้รับยังไม่ตรงกับ Job');
   if(!server.weightPhoto)missing.push('ยังไม่มีภาพใบชั่งปลายทาง');
   if(!server.emptyTruckPhoto)missing.push('ยังไม่มีภาพกระบะเปล่า');
   if(missing.length){
     alert('ยังส่ง e-POD ไม่ได้ เนื่องจาก:\n• '+missing.join('\n• ')+'\n\nกรุณาตรวจสอบในเครื่องที่เกี่ยวข้อง และลองใหม่อีกครั้ง');
     await lanPoll();return;
   }
   const result=await fetch('/api/patch',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({role:'driver',clientId:LAN_UID,resetEpoch:lanObservedResetEpoch,job:{submitted:true,evidenceRound:Math.max(1,Number(server.evidenceRound)||0)}})
   });
   const reply=await result.json();
   if(!result.ok||!reply.ok){
     if(reply.error==='receiver-scan-not-confirmed')throw new Error('ข้อมูลการสแกน QR ของผู้รับยังไม่ถูกยืนยันในเซิร์ฟเวอร์ กรุณารอสักครู่');
     throw new Error('เซิร์ฟเวอร์ไม่ยอมรับ e-POD: '+(reply.error||result.status));
   }
   // Synchronize browser from the accepted server response before displaying success.
   await lanPoll();
   alert('ส่ง e-POD ให้ EGAT สำเร็จแล้ว กำลังรอเจ้าหน้าที่ตรวจสอบ');
 }catch(err){alert('ส่ง e-POD ไม่สำเร็จ: '+err.message)}
 finally{for(const b of buttons)b.disabled=false;renderMobile()}
}

function selectStandaloneRole(role){
 if(role!=='driver'&&role!=='receiver')return;
 LAN_ROLE=role;s=initial();s.logged=false;s.mobileRole=role;s.mobileTab='home';s.mobileView='credentials';
 if(role==='receiver'&&!s.job.arrived)standaloneArrive();
 document.getElementById('simulateDetails').classList.add('enabled');
 document.getElementById('simulateDetails').open=false;
 standaloneTools();renderMobile();window.scrollTo(0,0);
}
function exitStandaloneRole(){
 LAN_ROLE=null;s=initial();s.logged=false;s.mobileRole=null;s.mobileView='login';
 document.getElementById('simulateDetails').classList.remove('enabled');
 document.getElementById('simulateDetails').open=false;
 renderMobile();window.scrollTo(0,0);
}
